# ============================================================================
# DMGameEngine CI（ROADMAP 阶段 0b）
#
# 设计决策：
# - 生成器选 "Visual Studio 17 2022" 而不是 Ninja + vcvars：
#   GitHub 的 windows-latest 镜像自带完整 VS2022 与对应 CMake/Ninja/MSBuild，
#   VS 生成器无需任何环境引导步骤（Ninja 方案需要 ilammy/msvc-dev-cmd 之类
#   的 vcvars action，多一层第三方依赖与失败面）。项目本身用 MSVC 工具链
#   （C++23, /W4 /utf-8），VS 生成器默认即可命中正确工具集。
#   ⚠️ 若 runner 镜像升级导致 VS 版本/生成器名不匹配（例如 windows-latest
#   切到只带 VS2026 的镜像），把 -G 参数改成镜像实际自带的版本即可；
#   也可改用 Ninja：先 `ilammy/msvc-dev-cmd@v1` 引导环境，再
#   `cmake -S . -B build -G Ninja ...`。
# - CMake ≥ 3.20：runner 预装 CMake 远高于此，无需额外安装。
# - GoogleTest / entt / nlohmann_json 走 FetchContent，configure 需要网络，
#   GitHub runner 默认可出网，无需配置。
# - clang-tidy：见仓库根 .clang-tidy。已设独立 job（continue-on-error 的报告型，
#   不拦截）；存量噪声清理完后可升级为强制门禁。
#   （本地可跑：cmake -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 后 clang-tidy -p build）
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交只保留最新一次运行，节省 Windows runner 配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + Test (MSVC, Debug)
    runs-on: windows-latest
    # fail-fast：矩阵内任一 job 失败即取消其余，快速反馈
    strategy:
      fail-fast: true
      matrix:
        # 目前单配置；后续如加 GCC/Clang 或 Vulkan job，往这里加即可
        config: [Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DDMGE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      # 历史坑：enable_testing() 曾写在 engine/ 子目录，根 ctest 假绿（详见 kb/KB-07 K-011），已挪至根 CMakeLists.txt。
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  # ------------------------------------------------------------------
  # clang-tidy 报告 job（非门禁）：仓库根 .clang-tidy 为保守检查集。
  # continue-on-error: true —— 只输出报告不拦截合并，存量噪声清理完后再升级为强制门禁。
  # Ninja 生成器才能导出 compile_commands.json（VS 生成器不支持），故需 vcvars 引导。
  # ------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy (report only)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (export compile_commands.json)
        run: >
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DDMGE_BUILD_TESTS=ON

      - name: Run clang-tidy (engine sources)
        shell: pwsh
        run: >
          $files = Get-ChildItem -Recurse -Filter *.cpp -Path engine/src |
          ForEach-Object { $_.FullName } ;
          clang-tidy -p build-tidy @files

  # ------------------------------------------------------------------
  # Vulkan 后端构建（可选加分项，暂为骨架，整体注释掉并注明原因）：
  # DMGE_VULKAN_BACKEND=ON 需要本机 Vulkan SDK（VMA + shaderc，见 kb/KB-01）。
  # 在 GitHub runner 上装 SDK 有两种路径：
  #   1) actlikeapple/install-vulkan-sdk 或类似社区 action（版本维护不确定）；
  #   2) 直接下载 LunarG 官方安装器静默安装：
  #      https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe
  # 由于社区 action 可靠性未验证、安装器 URL/校验和会随 SDK 版本漂移，
  # 先留骨架，待渲染 Agent 确认 SDK 固定版本号后再启用。
