# ============================================================================
# DMGameEngine CI（ROADMAP 阶段 0b）
#
# 设计决策：
# - 生成器选 Ninja + ilammy/msvc-dev-cmd：GitHub 的 windows-latest 镜像已迁移
#   到不含 VS2022 实例的 VS2026 镜像，`-G "Visual Studio 17 2022"` 会直接报
#   "could not find any instance of Visual Studio"（首次 CI 实跑失败原因，
#   2026-10-03）。Ninja 路径与本地开发路径（CLion Ninja + vcvars）完全一致，
#   且 clang-tidy job 已在 runner 上验证 Ninja configure 可行。
# - CMake ≥ 3.20：runner 预装 CMake 远高于此，无需额外安装。
# - GoogleTest / entt / nlohmann_json 走 FetchContent，configure 需要网络，
#   GitHub runner 默认可出网，无需配置。
# - clang-tidy：见仓库根 .clang-tidy。报告型 job（continue-on-error + 步骤
#   恒绿，报告只在日志里），存量噪声清理完后可升级为强制门禁。
#   （本地可跑：cmake -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 后 clang-tidy -p build）
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交只保留最新一次运行，节省 Windows runner 配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + Test (MSVC, Debug)
    runs-on: windows-latest
    # fail-fast：矩阵内任一 job 失败即取消其余，快速反馈
    strategy:
      fail-fast: true
      matrix:
        # 目前单配置；后续如加 GCC/Clang 或 Vulkan job，往这里加即可
        config: [Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DDMGE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      # Ninja 是单配置生成器，无需 -C。历史坑：enable_testing() 曾写在
      # engine/ 子目录，根 ctest 假绿（详见 kb/KB-07 K-011），已挪至根 CMakeLists.txt。
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ------------------------------------------------------------------
  # clang-tidy 报告 job（非门禁）：仓库根 .clang-tidy 为保守检查集。
  # continue-on-error + 步骤恒绿——报告只进日志，不拦截合并。
  # ------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy (report only)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (export compile_commands.json)
        run: >
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DDMGE_BUILD_TESTS=ON

      - name: Run clang-tidy (engine sources)
        shell: pwsh
        run: >
          $files = Get-ChildItem -Recurse -Filter *.cpp -Path engine/src |
          ForEach-Object { $_.FullName } ;
          clang-tidy -p build-tidy @files ;
          Write-Host "clang-tidy exit code: $LASTEXITCODE (report-only, non-gating)" ;
          exit 0

  # ------------------------------------------------------------------
  # Vulkan 后端构建（可选加分项，暂为骨架，整体注释掉并注明原因）：
  # DMGE_VULKAN_BACKEND=ON 需要本机 Vulkan SDK（VMA + shaderc，见 kb/KB-01）。
  # 在 GitHub runner 上装 SDK 有两种路径：
  #   1) actlikeapple/install-vulkan-sdk 或类似社区 action（版本维护不确定）；
  #   2) 直接下载 LunarG 官方安装器静默安装：
  #      https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe
  # 由于社区 action 可靠性未验证、安装器 URL/校验和会随 SDK 版本漂移，
  # 先留骨架，待渲染 Agent 确认 SDK 固定版本号后再启用。
